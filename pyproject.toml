[project]
name = "icloud-mcp"
version = "0.1.0"
description = "Serveur MCP en lecture seule pour la boite mail iCloud (IMAP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.7",
]

[project.scripts]
icloud-mcp = "icloud_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "anyio>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
