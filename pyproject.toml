[project]
name = "icloud-mcp"
version = "0.1.0"
description = "MCP server for iCloud Mail: read, search and send email over IMAP/SMTP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.7",
]

keywords = ["mcp", "model-context-protocol", "icloud", "imap", "email", "smtp", "claude", "apple-mail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://github.com/JulienRabault/icloud-mcp"
Issues = "https://github.com/JulienRabault/icloud-mcp/issues"

[project.scripts]
icloud-mcp = "icloud_mcp.__main__:main"
icloud-mcp-setup = "icloud_mcp.setup_wizard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "anyio>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
